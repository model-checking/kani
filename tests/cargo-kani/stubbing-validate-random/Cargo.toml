[package]
name = "stubbing-validate-random"
version = "0.1.0"
edition = "2021"

[dependencies]
# zerocopy 0.8.60 (pulled in by rand through ppv-lite86) doesn't compile under `--cfg kani`
# without its `derive` feature. Remove once a fixed release is out:
# https://github.com/model-checking/kani/issues/4988
zerocopy = "=0.8.59"
rand = "0.8.5"

[package.metadata.kani.unstable]
stubbing = true
