# We use block scalar notation to allow us to add ":" to the workflow name.
name: >-
  Nightly: CBMC Latest

permissions:
  contents: read

on:
  schedule:
    - cron: "0 9 * * *" # Run this every day at 9 AM UTC (4 AM ET/1 AM PT)
  workflow_dispatch:    # Allow manual dispatching for a custom branch / tag.


env:
  RUST_BACKTRACE: 1

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15-intel, ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Checkout Kani under "kani"
        uses: actions/checkout@v6
        with:
          path: kani

      - name: Setup Kani Dependencies
        uses: ./kani/.github/actions/setup
        with:
          os: ${{ matrix.os }}
          kani_dir: 'kani'

      - name: Checkout CBMC under "cbmc"
        uses: actions/checkout@v6
        with:
          repository: diffblue/cbmc
          path: cbmc

      - name: Build CBMC (Linux)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        working-directory: ./cbmc
        run: |
          cmake -S . -Bbuild -DWITH_JBMC=OFF -Dsat_impl="minisat2;cadical"
          cmake --build build -- -j 4
          # Prepend the bin directory to $PATH
          echo "${GITHUB_WORKSPACE}/cbmc/build/bin" >> $GITHUB_PATH

      - name: Build CBMC (macOS)
        if: ${{ startsWith(matrix.os, 'macos') }}
        working-directory: ./cbmc
        run: |
          cmake -S . -Bbuild -DWITH_JBMC=OFF -Dsat_impl="minisat2;cadical" -DCMAKE_CXX_COMPILER=$(which clang++)
          cmake --build build -- -j 4
          # Prepend the bin directory to $PATH
          echo "${GITHUB_WORKSPACE}/cbmc/build/bin" >> $GITHUB_PATH

      - name: Execute Kani regressions
        working-directory: ./kani
        run: ./scripts/kani-regression.sh

  perf:
    runs-on: ubuntu-24.04
    # The perf suite is memory-hungry: the s2n-quic harnesses solve large
    # formulas, and running them concurrently exhausts a standard runner, which
    # shows up as an unattributable SIGTERM (exit 143) or "the hosted runner
    # lost communication with the server" a few minutes into the step rather
    # than as a test failure. Run serially instead, as kani.yml does. That takes
    # ~45 min, so the 180-min step timeout leaves ample headroom, and the job
    # timeout sits above (step timeout) x (max_attempts) so a retry can land.
    timeout-minutes: 380
    steps:
      - name: Checkout Kani under "kani"
        uses: actions/checkout@v6
        with:
          path: kani

      - name: Setup Kani Dependencies
        uses: ./kani/.github/actions/setup
        with:
          os: ubuntu-24.04
          kani_dir: 'kani'

      - name: Build Kani using release mode
        working-directory: ./kani
        run: cargo build-dev -- --release

      - name: Checkout CBMC under "cbmc"
        uses: actions/checkout@v6
        with:
          repository: diffblue/cbmc
          path: cbmc

      - name: Build CBMC
        working-directory: ./cbmc
        run: |
          cmake -S . -Bbuild -DWITH_JBMC=OFF -Dsat_impl="minisat2;cadical"
          cmake --build build -- -j 4
          # Prepend the bin directory to $PATH
          echo "${GITHUB_WORKSPACE}/cbmc/build/bin" >> $GITHUB_PATH

      - name: Execute Kani performance tests
        # Run the suite serially and allow one retry, matching the perf job in
        # kani.yml. `working-directory` is not valid on a `uses` step, so the
        # command changes directory itself.
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 180
          max_attempts: 2
          command: cd kani && ./scripts/kani-perf.sh
        env:
          RUST_TEST_THREADS: 1

      - name: Execute Kani performance ignored tests
        working-directory: ./kani
        continue-on-error: true
        run: cargo run -p compiletest -- --suite perf --mode cargo-kani-test ignore --ignored --no-fail-fast
        env:
          RUST_TEST_THREADS: 1
