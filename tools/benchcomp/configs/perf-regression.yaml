#
# Run the Kani perf suite twice, erroring out on regression. This config
# file is primarily intended to be used in CI, because it assumes that
# there are two Kani checkouts in the 'old' and 'new' directories;
# benchcomp compares the performance of these two checkouts.

variants:
  kani_new:
    config:
      directory: new
      command_line: "scripts/setup/ubuntu/install_deps.sh && scripts/kani-perf.sh"
      env:
        RUST_TEST_THREADS: "1"
  kani_old:
    config:
      directory: old
      command_line: "scripts/setup/ubuntu/install_deps.sh && scripts/kani-perf.sh"
      env:
        RUST_TEST_THREADS: "1"

run:
  suites:
    kani_perf:
      parser:
        module: kani_perf
      variants: [kani_old, kani_new]

visualize:
  - type: dump_yaml
    out_file: '-'

  - type: dump_markdown_results_table
    out_file: '-'
    scatterplot: linear
    extra_columns:

      # For these two metrics, display the difference between old and new and
      # embolden if the absolute difference is more than 10% of the old value
      number_vccs:
      - column_name: diff old → new
        text: >
          lambda b: "" if b["kani_new"] == b["kani_old"]
          else ("**" if abs((b["kani_new"]-b["kani_old"])/b["kani_old"]) > 0.1 else "")
          + ("+" if b["kani_new"] > b["kani_old"] else "")
          + str(b["kani_new"] - b["kani_old"])
          + ("**" if abs((b["kani_new"]-b["kani_old"])/b["kani_old"]) > 0.1 else "")
      number_program_steps:
      - column_name: diff old → new
        text: >
          lambda b: "" if b["kani_new"] == b["kani_old"]
          else ("**" if abs((b["kani_new"]-b["kani_old"])/b["kani_old"]) > 0.1 else "")
          + ("+" if b["kani_new"] > b["kani_old"] else "")
          + str(b["kani_new"] - b["kani_old"])
          + ("**" if abs((b["kani_new"]-b["kani_old"])/b["kani_old"]) > 0.1 else "")

      # For 'runtime' metrics, display the % change from old to new, emboldening
      # cells whose absolute change is >50%
      solver_runtime:
      - column_name: "% change old → new"
        text: >
          lambda b: "" if b["kani_new"] == b["kani_old"]
          else ("**" if abs((b["kani_new"]-b["kani_old"])/b["kani_old"]) > 0.5 else "")
          + ("+" if b["kani_new"] > b["kani_old"] else "")
          + "%.3f%%" % ((b["kani_new"] - b["kani_old"]) * 100 / b["kani_old"])
          + ("**" if abs((b["kani_new"]-b["kani_old"])/b["kani_old"]) > 0.5 else "")
      verification_time:
      - column_name: "% change old → new"
        text: >
          lambda b: "" if b["kani_new"] == b["kani_old"]
          else ("**" if abs((b["kani_new"]-b["kani_old"])/b["kani_old"]) > 0.5 else "")
          + ("+" if b["kani_new"] > b["kani_old"] else "")
          + "%.3f%%" % ((b["kani_new"] - b["kani_old"]) * 100 / b["kani_old"])
          + ("**" if abs((b["kani_new"]-b["kani_old"])/b["kani_old"]) > 0.5 else "")
      symex_runtime:
      - column_name: "% change old → new"
        text: >
          lambda b: "" if b["kani_new"] == b["kani_old"]
          else ("**" if abs((b["kani_new"]-b["kani_old"])/b["kani_old"]) > 0.5 else "")
          + ("+" if b["kani_new"] > b["kani_old"] else "")
          + "%.3f%%" % ((b["kani_new"] - b["kani_old"]) * 100 / b["kani_old"])
          + ("**" if abs((b["kani_new"]-b["kani_old"])/b["kani_old"]) > 0.5 else "")

      solver_calls:
      - column_name: diff old → new
        text: >
          lambda b: "" if b["kani_new"] == b["kani_old"]
          else ("+" if b["kani_new"] > b["kani_old"] else "")
          + str(b["kani_new"] - b["kani_old"])

      # For success metric, display some text if success has changed
      success:
      - column_name: change
        text: >
          lambda b: "" if b["kani_new"] == b["kani_old"]
          else "❌ newly failing" if b["kani_old"]
          else "✅ newly passing"

  - type: error_on_regression
    variant_pairs: [[kani_old, kani_new]]
    checks:
      - metric: success
        # Compare the old and new variants of each benchmark. The
        # benchmark has regressed if the lambda returns true.
        test: "lambda old, new: False if not old else not new"

      # Solver time is only attributable to a change when the change altered the formula, so
      # require that the VCC or step count moved before calling a slowdown a regression. On
      # identical counts the two sides are solving the same problem, and measurements of the
      # perf suite's heavy harnesses spread far too wide to read anything into the difference:
      # over seven `main` runs, 910 (benchmark, run) pairs with identical VCC *and* step counts
      # had a median old→new ratio of 0.99x but a range of 0.41x to 2.41x, and
      # `inet::checksum::tests::differential` alone ranged 38.8s to 116.0s on the `main` side.
      # That is what tripped this check on #4801, #4804 and #4820, none of which touched the
      # harnesses involved (https://github.com/model-checking/kani/issues/4822).
      #
      # `solver_runtime` also sums over a number of solver calls that is not stable across runs
      # of the same code (https://github.com/model-checking/kani/issues/4821), so compare the
      # per-call time, which is the quantity the two sides share.
      - metric: solver_runtime_per_call
        all_metrics: true
        test: >
          lambda old, new: False if (
            old["number_vccs"] == new["number_vccs"]
            and old["number_program_steps"] == new["number_program_steps"]
          ) else (
            new["solver_runtime"] >= 10
            and new["solver_runtime_per_call"] / old["solver_runtime_per_call"] > 1.5
          )

      # Symex time is deterministic given the formula, so it keeps the simple rule.
      - metric: symex_runtime
        test: "lambda old, new: False if new < 10 else new/old > 1.5"
